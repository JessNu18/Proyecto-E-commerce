services:
  mysql:
    image: mysql:8.4
    container_name: orderpulse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_123
      MYSQL_DATABASE: orderpulse
      MYSQL_USER: orderpulse
      MYSQL_PASSWORD: orderpulse_dev_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: orderpulse-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo_dev_123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
